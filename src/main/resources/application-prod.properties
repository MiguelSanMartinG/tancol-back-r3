# Overlay de application.properties para productivo (profile=prod).
# Solo pisa conexion y deja explicito que no se puede borrar la BD.

# Conexion remota por variables de entorno del servidor. !PELIGRO! un host mal puesto apunta a otra BD.
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
# !PELIGRO! nunca pongas el password en este archivo; usa la variable de entorno.
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate no toca el esquema. !PELIGRO! create/create-drop BORRA productivo al arrancar. update tambien puede romper datos.
spring.jpa.hibernate.ddl-auto=none
# Sigue aplicando migraciones Flyway (altas/indices). No borra datos.
spring.flyway.enabled=true
# Impide flyway clean. !PELIGRO! false borra TODAS las tablas de productivo.
spring.flyway.clean-disabled=true
