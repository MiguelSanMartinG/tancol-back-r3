# Overlay de application.properties para desarrollo local (profile=dev).
# Activalo en IntelliJ: Active profiles = dev. Sin eso se usa el default (prod).

# Postgres local. !PELIGRO! credenciales en texto plano; no copiar este bloque a prod.
spring.datasource.url=jdbc:postgresql://localhost:5432/railway
spring.datasource.username=admin
spring.datasource.password=porygon1!

# Hereda none del base. !PELIGRO! no cambiar a create/create-drop: borra tablas al arrancar. update puede alterar columnas.
spring.jpa.hibernate.ddl-auto=none
# Hereda el bloqueo de clean. !PELIGRO! false permite flyway clean y vacia la BD local.
spring.flyway.clean-disabled=true

# Mas capacidad que prod: es solo tu maquina.
server.tomcat.max-threads=50
server.tomcat.accept-count=100
