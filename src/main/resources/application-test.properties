spring.application.name=Auth
server.servlet.context-path=/api/v1
#! BASE DE DATOS
spring.datasource.url=jdbc:postgresql://51.222.107.1:6000/railway
spring.datasource.username=postgres
spring.datasource.password=fLU5GMq0b3j8V1m49ENfgB6X40TvYC1KAKJ6JO44g71ScVuqFRmTpzAQPgBg8MjD
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
# Configuration JPA/Hibernate
spring.jpa.show-sql=false
# Para ver las consultas SQL en la consola
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
#! SEGURIDAD
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=86400000
#! LOGGING
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
# Configurar el nivel de log global
logging.level.root=INFO
logging.level.com.example.MyService=DEBUG
# Configurar la ubicación de los archivos de log
logging.file.name=logs/myapp.log
# Definir el patrón de los logs de la consola (opcional)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Habilitar colores ANSI en la consola
spring.output.ansi.enabled=ALWAYS
#! SWAGGER CONFIG
springdoc.swagger-ui.persist-authorization=true
server.forward-headers-strategy=framework
springdoc.writer-with-order-by-keys:true
#! SUBIDA DE ARCHIVOS
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#! POOL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
#! Multri Trending
server.tomcat.max-threads=10
server.tomcat.accept-count=20