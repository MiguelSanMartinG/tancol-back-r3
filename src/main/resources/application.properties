spring.application.name=Auth
server.servlet.context-path=/api/v1
spring.profiles.default=test

#! BASE DE DATOS

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}


spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate = true

# Configuration JPA/Hibernate
spring.jpa.show-sql=false

# Para ver las consultas SQL en la consola
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true


#! SEGURIDAD

security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=3600000

#! LOGGING

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
# Configurar el nivel de log global
logging.level.root=INFO

logging.level.com.example.MyService=DEBUG

# Configurar la ubicación de los archivos de log
logging.file.name=logs/myapp.log

# Definir el patrón de los logs de la consola (opcional)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Habilitar colores ANSI en la consola
spring.output.ansi.enabled=ALWAYS

#! SWAGGER CONFIG

springdoc.swagger-ui.persist-authorization=true
server.forward-headers-strategy=framework

#! SUBIDA DE ARCHIVOS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB