# Config compartida. Los profiles (dev/prod) solo pisan lo que cambia.
spring.application.name=Auth
# Prefijo de todas las URLs: /api/v1/...
server.servlet.context-path=/api/v1
# Profile si no se indica otro. !PELIGRO! con prod, un arranque local sin profile usa la BD de productivo.
spring.profiles.default=prod

# Driver JDBC de PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver
# Cierra el EntityManager al salir del servicio; evita lazy-load accidental en la vista.
spring.jpa.open-in-view=false
# No imprime cada SQL en consola.
spring.jpa.show-sql=false
# Permite lazy-load fuera de transaccion. !PELIGRO! dispara queries extra y puede tumbar el pool.
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Agrupa asociaciones no cargadas en lotes. Sin esto cada modulo o rol es un viaje aparte a Postgres.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Hibernate no crea ni altera tablas. !PELIGRO! create/create-drop BORRA y recrea el esquema al arrancar. update tambien puede romper columnas.
spring.jpa.hibernate.ddl-auto=none

# Aplica migraciones SQL al arrancar (V1, V10, etc.). No borra datos por si sola.
spring.flyway.enabled=true
# Carpeta de las migraciones.
spring.flyway.locations=classpath:db/migration
# Si la BD ya existia sin historial Flyway, la marca como baseline en vez de fallar.
spring.flyway.baseline-on-migrate=true
# Bloquea flyway clean. !PELIGRO! false permite borrar TODAS las tablas de la base.
spring.flyway.clean-disabled=true

# Firma de los JWT. !PELIGRO! si se filtra, cualquiera puede inventar tokens validos.
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# Vida del token en milisegundos (aqui 24 h).
security.jwt.expiration-time=86400000

# Silencia un warning ruidoso de Spring Security.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.root=INFO
logging.level.com.main.tancol=DEBUG
logging.file.name=logs/myapp.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
spring.output.ansi.enabled=ALWAYS

# Swagger recuerda el Bearer al recargar la UI.
springdoc.swagger-ui.persist-authorization=true
springdoc.writer-with-order-by-keys=true
# Respeta X-Forwarded-* detras de un proxy/nginx.
server.forward-headers-strategy=framework

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pool de conexiones a Postgres.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# Tope de hilos HTTP del servidor.
server.tomcat.max-threads=10
# Cola de peticiones cuando todos los hilos estan ocupados.
server.tomcat.accept-count=20

# UUIDs de conceptos de venta para KPIs oficiales. No son nombres: son ids de liquidacion_conceptos_venta.
tancol.kpi.conceptos.pg=b6ccdf91-eb42-422a-b30c-bd0a028738fc
tancol.kpi.conceptos.exp=3e397f5b-26f4-46b6-ab13-0f61b15108d0
